<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js"></script>
      <script src="https://unpkg.com/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>

    <title>layout</title>
</head>
<body>
<a-scene>
     <a-entity environment="preset: forest; groundColor:#58755E
; groundTexture:none; class="floor""></a-entity>

  <a-assets>
   <a-asset-item id="foodtruck2" src="/truck/FoodTruck.glb"></a-asset-item>
   <a-asset-item id="logo" src="LOGO-BG.glb"></a-asset-item>
   <a-asset-item id="logosm" src="LOGO-SM.glb"></a-asset-item>
   <a-asset-item id="can" src="can-outline2.glb"></a-asset-item>
   <img id="bluerug" src="blu.jpeg"/>
   <img id="tanrug" src="tanrug.jpeg"/>
   <a-asset-item id="swing" src="swing.obj"></a-asset-item>

  </a-assets>

  <a-entity id="player" position="0 1.6 0">
            <!-- camera -->
            <a-entity id="camera" camera wasd-controls look-controls></a-entity>
            <!-- hand controls -->
            <a-entity id="left-hand" raycaster="objects: .floor" oculus-touch-controls="hand: left" blink-controls></a-entity>
            <a-entity id="right-hand" raycaster="objects: .floor" oculus-touch-controls="hand: right" blink-controls></a-entity>
        </a-entity>



<a-entity gltf-model="/truck/FoodTruck.glb" position="-5.8306 0 -6.66087" rotation="0 -57.160000000000004 0"></a-entity>


<a-circle  src="#tanrug" position="-4.21459 0.01225 -5.9923" rotation="-90 0 0" radius="0.8" geometry="radius: 1.94">
</a-circle>

<a-box position="-2.60669 0.83054 -7.35523" depth="1" height="1" width="1" color="#pink" border-radius:"20="" 20="" 0="" "="" geometry="depth: 0.05; height: 1.7" rotation="-8.39 10 0">
</a-box>

<a-entity obj-model="obj: swing.obj" scale="0.035 0.035 0.035" position="-10.75375 0.36235 1.64407" rotation="0 -2.73 0"></a-entity>

<a-cylinder position="-1.95978 0.1701 -7.77592" radius="0.3" height="1.5" color="green" geometry="height: 0.41; radius: 0.26">
</a-cylinder>

<a-cylinder position="-2.07795 0.14129 -6.9778" radius="0.3" height="1.5" color="green" geometry="height: 0.28; radius: 0.2">
</a-cylinder>

<a-circle position="5.02538 0.00379 -3.98544" rotation="-90 0 0" radius="0.8"  geometry="radius: 1.16" src="#bluerug">
</a-circle>

<a-circle position="3.9889 0.00055 -5.19678" rotation="-90 0 0" radius="0.8" geometry="radius: 1.38" src="#tanrug">
</a-circle>

<a-cylinder position="4.37457 0.1701 -6.40989" radius="0.3" height="1.5" color="green" geometry="height: 0.35; radius: 0.51">
</a-cylinder>

<a-cylinder position="6.43785 0.1701 -3.57454" radius="0.3" height="1.5" color="green" geometry="height: 0.46; radius: 0.56">
</a-cylinder>

<!-- tree -->
<a-entity position="-10.39787 2.29134 0"> 
<a-cylinder color="#a29f39" height="1.5" radius="0.4" segments-radial="32" geometry="height: 1.7; radius: 0.81" position="0 0.24177 0">
        </a-cylinder>
<a-sphere color="#a29f39" radius="0.4" position="0 1.10071 0" geometry="radius: 0.81">
        </a-sphere>
<a-cylinder color="#a29f39" height="1.5" radius="0.4" segments-radial="32" geometry="height: 2.22; radius: 0.11" position="0 -1.65533 0">
        </a-cylinder>     
</a-entity>

<!-- tree -->
<a-entity position="-10.86143 2.29134 3.30539"> 
<a-cylinder color="#a29f39" height="1.5" radius="0.4" segments-radial="32" geometry="height: 1.7; radius: 0.81" position="0 0.24177 0">
        </a-cylinder>
<a-sphere color="#a29f39" radius="0.4" position="0 1.10071 0" geometry="radius: 0.81">
        </a-sphere>
<a-cylinder color="#a29f39" height="1.5" radius="0.4" segments-radial="32" geometry="height: 2.22; radius: 0.11" position="0 -1.65533 0">
        </a-cylinder>     
</a-entity>

<!-- Light Right-->
<a-entity position="-10.05414 1.41182 0.43501" scale="0.4 0.4 0.4">

  <!-- Main body (round + soft) -->
  <a-sphere radius="0.35" scale="1 1.2 1" material="opacity: 0.6; transparent: true; color: #FFE4EC; emissive: #FFB6C1; emissiveIntensity: 0.5">
  </a-sphere>

  <!-- Top cap -->
  <a-sphere position="0 0.45 0" radius="0.15" color="#FF9AA2">
  </a-sphere>

  <!-- Bottom cap -->
  <a-sphere position="0 -0.45 0" radius="0.12" color="#FF9AA2">
  </a-sphere>

  <!-- Little handle -->
  <a-torus position="0 0.65 0" radius="0.2" radius-tubular="0.02" color="#FF9AA2" rotation="90 0 0">
  </a-torus>

  <!-- Glow light -->
  <a-light type="point" color="#FFC1CC" intensity="1.5" distance="6">
  </a-light>

</a-entity>

<!-- Light Left-->
<a-entity position="-10.4716 1.41182 2.92319" scale="0.4 0.4 0.4">

  <!-- Main body (round + soft) -->
  <a-sphere radius="0.35" scale="1 1.2 1" material="opacity: 0.6; transparent: true; color: #FFE4EC; emissive: #FFB6C1; emissiveIntensity: 0.5">
  </a-sphere>

  <!-- Top cap -->
  <a-sphere position="0 0.45 0" radius="0.15" color="#FF9AA2">
  </a-sphere>

  <!-- Bottom cap -->
  <a-sphere position="0 -0.45 0" radius="0.12" color="#FF9AA2">
  </a-sphere>

  <!-- Little handle -->
  <a-torus position="0 0.65 0" radius="0.2" radius-tubular="0.02" color="#FF9AA2" rotation="90 0 0">
  </a-torus>

  <!-- Glow light -->
  <a-light type="point" color="#FFC1CC" intensity="1.5" distance="6">
  </a-light>

</a-entity>

<!--Light for mirror-->
<a-entity>
<!-- Main body (round + soft) -->
  <a-sphere radius="0.35" scale="1 1.2 1" material="opacity: 0.6; transparent: true; color: #FFE4EC; emissive: #FFB6C1; emissiveIntensity: 0.5">
  </a-sphere>

<!-- Glow light -->
  <a-light type="point" color="#FFC1CC" intensity="1.5" distance="6">
  </a-light>
</a-entity>
